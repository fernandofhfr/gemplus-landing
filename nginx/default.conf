server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;
  autoindex off;

  location = / {
    try_files /index.html =404;
  }

  location = /index.html {
    try_files $uri =404;
    expires -1;
    add_header Cache-Control "no-cache";
  }

  location = /styles.css {
    try_files $uri =404;
    expires 1h;
    add_header Cache-Control "public, max-age=3600";
  }

  location = /main.js {
    try_files $uri =404;
    expires 1h;
    add_header Cache-Control "public, max-age=3600";
  }

  location = /dist/tailwind.css {
    try_files $uri =404;
    expires 1h;
    add_header Cache-Control "public, max-age=3600";
  }

  location /assets/ {
    try_files $uri =404;
    expires 7d;
    add_header Cache-Control "public, max-age=604800";
    access_log off;
  }

  location /dist/ {
    try_files $uri =404;
    expires 1h;
    add_header Cache-Control "public, max-age=3600";
  }

  location / {
    try_files $uri =404;
  }

  location ~ /\.(?!well-known) {
    deny all;
  }
}
