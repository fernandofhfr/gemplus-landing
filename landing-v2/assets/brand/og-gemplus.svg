<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a2038"/>
      <stop offset="100%" stop-color="#212842"/>
    </linearGradient>
    <linearGradient id="accent-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f8f4ed" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#f8f4ed" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="card-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a3354"/>
      <stop offset="100%" stop-color="#212842"/>
    </linearGradient>
    <clipPath id="card-clip">
      <rect x="0" y="0" width="100%" height="100%" rx="12"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg-grad)"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.04" stroke="#f8f4ed" stroke-width="1">
    <line x1="0" y1="157.5" x2="1200" y2="157.5"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="472.5" x2="1200" y2="472.5"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
  </g>

  <!-- Decorative accent bar top -->
  <rect x="0" y="0" width="1200" height="4" fill="#f8f4ed" opacity="0.15"/>

  <!-- Left content area -->
  <g transform="translate(80, 0)">
    <!-- GEM+ wordmark -->
    <text x="0" y="210" font-family="Georgia, 'Times New Roman', serif" font-weight="900" font-size="120" fill="#f8f4ed" letter-spacing="-3">GEM</text>
    <text x="290" y="210" font-family="Georgia, 'Times New Roman', serif" font-weight="900" font-size="120" fill="#f8f4ed" opacity="0.4">+</text>

    <!-- Tagline -->
    <text x="0" y="280" font-family="'Segoe UI', -apple-system, system-ui, sans-serif" font-weight="600" font-size="32" fill="#f8f4ed" opacity="0.9">Gestão musical para igrejas</text>

    <!-- Subtitle -->
    <text x="0" y="325" font-family="'Segoe UI', -apple-system, system-ui, sans-serif" font-weight="400" font-size="20" fill="#f8f4ed" opacity="0.55">Do caos das planilhas ao controle total.</text>

    <!-- CTA hint -->
    <g transform="translate(0, 380)">
      <rect width="220" height="50" rx="10" fill="#f8f4ed"/>
      <text x="110" y="32" font-family="'Segoe UI', -apple-system, system-ui, sans-serif" font-weight="700" font-size="16" fill="#212842" text-anchor="middle">Solicitar demonstração</text>
    </g>
  </g>

  <!-- Right side: abstract dashboard mockup -->
  <g transform="translate(640, 100)">
    <!-- Main card -->
    <rect width="460" height="430" rx="12" fill="url(#card-grad)" stroke="#f8f4ed" stroke-opacity="0.08" stroke-width="1"/>

    <!-- Card header -->
    <rect x="20" y="20" width="200" height="14" rx="4" fill="#f8f4ed" opacity="0.15"/>
    <rect x="340" y="18" width="100" height="20" rx="10" fill="#f8f4ed" opacity="0.08"/>

    <!-- Stat cards row -->
    <rect x="20" y="56" width="130" height="80" rx="8" fill="#f8f4ed" opacity="0.06"/>
    <rect x="166" y="56" width="130" height="80" rx="8" fill="#f8f4ed" opacity="0.06"/>
    <rect x="312" y="56" width="130" height="80" rx="8" fill="#f8f4ed" opacity="0.06"/>

    <!-- Stat numbers -->
    <text x="85" y="100" font-family="'Segoe UI', system-ui, sans-serif" font-weight="800" font-size="28" fill="#f8f4ed" opacity="0.7" text-anchor="middle">48</text>
    <text x="85" y="120" font-family="'Segoe UI', system-ui, sans-serif" font-weight="400" font-size="11" fill="#f8f4ed" opacity="0.4" text-anchor="middle">Alunos</text>
    <text x="231" y="100" font-family="'Segoe UI', system-ui, sans-serif" font-weight="800" font-size="28" fill="#f8f4ed" opacity="0.7" text-anchor="middle">5</text>
    <text x="231" y="120" font-family="'Segoe UI', system-ui, sans-serif" font-weight="400" font-size="11" fill="#f8f4ed" opacity="0.4" text-anchor="middle">Instrutores</text>
    <text x="377" y="100" font-family="'Segoe UI', system-ui, sans-serif" font-weight="800" font-size="28" fill="#f8f4ed" opacity="0.7" text-anchor="middle">3</text>
    <text x="377" y="120" font-family="'Segoe UI', system-ui, sans-serif" font-weight="400" font-size="11" fill="#f8f4ed" opacity="0.4" text-anchor="middle">Famílias</text>

    <!-- Progress bars -->
    <rect x="20" y="160" width="420" height="50" rx="8" fill="#f8f4ed" opacity="0.04"/>
    <rect x="36" y="175" width="100" height="10" rx="5" fill="#f8f4ed" opacity="0.08"/>
    <rect x="36" y="175" width="65" height="10" rx="5" fill="#f8f4ed" opacity="0.25"/>
    <text x="148" y="184" font-family="system-ui, sans-serif" font-size="10" fill="#f8f4ed" opacity="0.35">Cordas 65%</text>

    <rect x="36" y="192" width="100" height="10" rx="5" fill="#f8f4ed" opacity="0.08"/>
    <rect x="36" y="192" width="45" height="10" rx="5" fill="#f8f4ed" opacity="0.2"/>
    <text x="148" y="201" font-family="system-ui, sans-serif" font-size="10" fill="#f8f4ed" opacity="0.35">Sopros 45%</text>

    <!-- Table rows -->
    <rect x="20" y="230" width="420" height="44" rx="8" fill="#f8f4ed" opacity="0.04"/>
    <circle cx="44" cy="252" r="12" fill="#f8f4ed" opacity="0.1"/>
    <rect x="64" y="245" width="120" height="8" rx="4" fill="#f8f4ed" opacity="0.12"/>
    <rect x="64" y="258" width="80" height="6" rx="3" fill="#f8f4ed" opacity="0.06"/>
    <rect x="350" y="246" width="70" height="16" rx="8" fill="#f8f4ed" opacity="0.1"/>

    <rect x="20" y="282" width="420" height="44" rx="8" fill="#f8f4ed" opacity="0.04"/>
    <circle cx="44" cy="304" r="12" fill="#f8f4ed" opacity="0.1"/>
    <rect x="64" y="297" width="140" height="8" rx="4" fill="#f8f4ed" opacity="0.12"/>
    <rect x="64" y="310" width="60" height="6" rx="3" fill="#f8f4ed" opacity="0.06"/>
    <rect x="350" y="298" width="70" height="16" rx="8" fill="#f8f4ed" opacity="0.1"/>

    <rect x="20" y="334" width="420" height="44" rx="8" fill="#f8f4ed" opacity="0.04"/>
    <circle cx="44" cy="356" r="12" fill="#f8f4ed" opacity="0.1"/>
    <rect x="64" y="349" width="100" height="8" rx="4" fill="#f8f4ed" opacity="0.12"/>
    <rect x="64" y="362" width="90" height="6" rx="3" fill="#f8f4ed" opacity="0.06"/>
    <rect x="350" y="350" width="70" height="16" rx="8" fill="#f8f4ed" opacity="0.1"/>

    <!-- Bottom bar -->
    <rect x="20" y="398" width="420" height="12" rx="6" fill="#f8f4ed" opacity="0.04"/>
    <rect x="20" y="398" width="180" height="12" rx="6" fill="#f8f4ed" opacity="0.1"/>
  </g>

  <!-- Subtle noise overlay -->
  <filter id="noise">
    <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
  </filter>
  <rect width="1200" height="630" filter="url(#noise)" opacity="0.03"/>
</svg>
